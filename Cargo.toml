[workspace]
resolver = "3"
members = ["crates/core", "crates/macos", "crates/app", "xtask"]
default-members = ["crates/core", "crates/macos", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/arrrlo/layoutsmart"
description = "Outsmart your desktop."
authors = ["arrrlo"]
rust-version = "1.85"

[workspace.dependencies]
layoutsmart-core = { path = "crates/core" }
layoutsmart-macos = { path = "crates/macos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

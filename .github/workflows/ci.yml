name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Gates (format, lints, tests, coverage, CRAP)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-crap@0.9.0
      - name: Rosetta (runs the Intel build of the tests)
        run: softwareupdate --install-rosetta --agree-to-license
      - run: cargo xtask check

  mutants:
    name: Mutation tests (${{ matrix.shard }}/4)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants counts its shards from 0.
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: cargo xtask mutants --shard ${{ matrix.shard }}/4 -j 3

  package:
    name: Build the installer
    needs: check
    runs-on: macos-15
    env:
      SIGN_P12_BASE64: ${{ secrets.SIGN_P12_BASE64 }}
      SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # With the certificate, every release has the same signing identity, so macOS keeps
      # the user's Accessibility permission across updates. Without it (forks, pull
      # requests) the build is signed ad hoc and works just the same otherwise.
      - name: Import the signing certificate
        if: env.SIGN_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$SIGN_P12_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$SIGN_P12_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGN_P12_PASSWORD" "$KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          # codesign only finds an identity in a keychain that is on the search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN"
          echo "LAYOUTSMART_SIGN_IDENTITY=Layoutsmart Self-Signed" >> "$GITHUB_ENV"
          echo "LAYOUTSMART_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - run: cargo xtask pkg
      - name: Checksum
        run: cd dist && shasum -a 256 Layoutsmart-*.pkg | tee SHA256SUMS.txt
      - name: Signature
        run: codesign -dvv dist/Layoutsmart.app 2>&1 | grep -E 'Identifier|Authority|Signature|Format'
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            dist/Layoutsmart-*.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  install-test:
    name: Install and run on ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every macOS version GitHub offers, on Apple Silicon and on real Intel Macs.
        os: [macos-15, macos-26, macos-15-intel, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist
      - name: System
        run: sw_vers && uname -m
      - name: Install the package
        run: sudo installer -pkg dist/Layoutsmart-*.pkg -target /
      - name: Everything is where it should be
        run: |
          set -eux
          test -d /Applications/Layoutsmart.app
          test -L /usr/local/bin/layoutsmart
          codesign --verify --deep --strict /Applications/Layoutsmart.app
          lipo -archs /Applications/Layoutsmart.app/Contents/MacOS/Layoutsmart
      - name: The command-line tool works
        run: |
          set -eux
          layoutsmart --version
          layoutsmart help | grep -q "save and restore window layouts"
          layoutsmart displays
      # Seeing other desktops relies on undocumented macOS functions. This proves they
      # exist and answer on this macOS version.
      - name: Desktops are visible to it
        run: |
          set -eux
          layoutsmart displays | grep "desktops:"
      # GitHub's Macs have Accessibility permission, so the real thing can be exercised.
      - name: Saves, restores, renames and deletes a profile
        run: |
          set -eux
          export LAYOUTSMART_DIR="$RUNNER_TEMP/profiles"
          layoutsmart profiles | grep -q "No saved profiles"
          layoutsmart list
          layoutsmart ci save
          layoutsmart profiles | grep -q "ci "
          layoutsmart ci restore
          layoutsmart restore
          layoutsmart rename ci renamed
          layoutsmart delete renamed
          layoutsmart profiles | grep -q "No saved profiles"
      # Full screen for real. TextEdit is saved as an ordinary window; a copy of that
      # profile says it is full screen. Restoring one and then the other must put the
      # window into full screen and take it out again.
      - name: Puts a window into full screen and takes it out again
        run: |
          set -eux
          export LAYOUTSMART_DIR="$RUNNER_TEMP/fullscreen"
          echo "Layoutsmart" > "$RUNNER_TEMP/note.txt"
          open -a TextEdit "$RUNNER_TEMP/note.txt"
          for attempt in $(seq 1 30); do layoutsmart list | grep -q TextEdit && break; sleep 1; done
          layoutsmart plain save
          jq '(.windows[] | select(.app == "TextEdit")) |= (del(.desktop) | .fullscreen = true)' \
            "$LAYOUTSMART_DIR/plain.json" > "$LAYOUTSMART_DIR/full.json"
          time layoutsmart full restore
          layoutsmart list
          layoutsmart displays
          layoutsmart list | grep TextEdit | grep -q "full screen"
          time layoutsmart plain restore
          layoutsmart list
          layoutsmart displays
          layoutsmart list | grep TextEdit | grep -q "desktop 1"
          layoutsmart plain restore
          osascript -e 'quit app "TextEdit"' || true
      - name: The Intel build runs too (Rosetta)
        if: runner.arch == 'ARM64'
        run: |
          set -eux
          softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/local/bin/layoutsmart --version
          arch -x86_64 /usr/local/bin/layoutsmart displays
          arch -x86_64 /usr/local/bin/layoutsmart list
      - name: The menu bar app starts and keeps running
        run: |
          set -ux
          pgrep -x Layoutsmart || open /Applications/Layoutsmart.app
          sleep 8
          pgrep -lx Layoutsmart
      # The installed copy registers itself as a login item the first time it runs, and
      # leaves a marker once macOS has accepted that.
      - name: Registered itself to start at login
        run: |
          set -ux
          sudo sfltool dumpbtm 2>/dev/null | grep -i -B3 -A14 'layoutsmart' | head -70 || true
          ls -la "$HOME/.config/layoutsmart/"
          test -f "$HOME/.config/layoutsmart/.login-item-registered"
      - name: Menu, dialogs and dashboard work (driven through the menu bar icon)
        run: swift scripts/smoke.swift /Applications/Layoutsmart.app/Contents/MacOS/Layoutsmart
      # When something above fails: what was on screen, and what the app was doing.
      - name: Collect evidence
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          screencapture -x "$RUNNER_TEMP/evidence/screen.png" || true
          ps aux | grep -i '[l]ayoutsmart' > "$RUNNER_TEMP/evidence/processes.txt" || true
          for pid in $(pgrep -x Layoutsmart); do
            sample "$pid" 2 -file "$RUNNER_TEMP/evidence/sample-$pid.txt" > /dev/null 2>&1 || true
          done
          ls -la "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence

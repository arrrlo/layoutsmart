name: Release

# Push a tag named v<version> (the version in Cargo.toml) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    name: Tag matches the version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask release-check "$GITHUB_REF_NAME"

  ci:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish the release
    needs: ci
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Layoutsmart-*.pkg dist/SHA256SUMS.txt \
            --title "Layoutsmart ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag

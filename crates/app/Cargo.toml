[package]
name = "layoutsmart"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description.workspace = true
publish = false

[[bin]]
name = "layoutsmart-cli"
path = "src/bin/layoutsmart-cli.rs"

[[bin]]
name = "layoutsmart-app"
path = "src/bin/layoutsmart-app.rs"

[dependencies]
layoutsmart-core.workspace = true
layoutsmart-macos.workspace = true
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSString", "NSArray", "NSDictionary", "NSIndexSet", "NSNotification", "NSGeometry",
    "NSURL", "NSObject", "NSThread", "NSError", "NSAttributedString", "NSEnumerator", "NSData", "NSRunLoop", "NSDate", "NSBundle",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "objc2-core-foundation",
    "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace",
    "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView",
    "NSMenu", "NSMenuItem", "NSAlert", "NSTextField", "NSWindow", "NSPanel",
    "NSSegmentedControl", "NSTableView", "NSTableColumn", "NSTableHeaderView", "NSScrollView", "NSClipView",
    "NSImage", "NSColor", "NSBezierPath", "NSFont", "NSFontDescriptor",
    "NSGraphics", "NSGraphicsContext", "NSStringDrawing", "NSAttributedString",
    "NSParagraphStyle", "NSText", "NSUserInterfaceItemIdentification",
    "NSBitmapImageRep", "NSImageRep",
] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "SMAppService", "objc2-foundation"] }
